<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Booking | Ghumo India</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="navbar"><div class="container nav"><a class="logo" href="index.html">🌏 Ghumo<span>India</span></a><nav><a href="index.html">Home</a><a href="destinations.html">Destinations</a><a href="packages.html">Packages</a></nav><a class="btn btn-small" href="dashboard.html">My Trips</a></div></header>
<main class="section"><div class="container narrow"><div class="form-card"><span class="eyebrow dark">BOOK YOUR TRIP</span><h1>Complete your booking</h1><div id="bookingPackage" class="booking-summary"></div><form id="bookingForm" onsubmit="submitBooking(event)"><label>Full Name</label><input id="bookName" required placeholder="Enter your name"><label>Email</label><input id="bookEmail" type="email" required placeholder="you@example.com"><label>Travel Date</label><input id="travelDate" type="date" required><div class="two-col"><div><label>Adults</label><input id="adults" type="number" min="1" value="1" oninput="updateTotal()"></div><div><label>Children</label><input id="children" type="number" min="0" value="0" oninput="updateTotal()"></div></div><label>Special Request</label><textarea id="request" placeholder="Any special requirements?"></textarea><div class="total-row"><span>Total estimated amount</span><strong id="bookingTotal">₹0</strong></div><button class="btn full">Confirm Booking</button></form></div></div></main><div id="modal" class="modal hidden"></div><script src="js/data.js"></script><script src="js/main.js"></script><script>setupBooking()</script></body></html>
